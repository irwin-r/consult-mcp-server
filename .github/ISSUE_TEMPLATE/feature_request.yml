name: Feature request
description: Suggest a new capability or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: |
        Describe the situation, what you currently do, and where it falls
        short. Skip straight to the solution and we'll usually push back to
        ask this anyway.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed shape (optional)
      description: |
        If you have a specific shape in mind (new tool argument, new model
        provider, etc.), describe it here. If not, leave blank — we'll
        figure it out together.
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      multiple: false
      options:
        - Engine (consult.*)
        - MCP adapter (consult.mcp.*)
        - CLI (consult-ledger / consult-view / consult-doctor)
        - Model registry / new provider
        - Docs
        - Other
