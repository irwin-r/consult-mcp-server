name: audit

# pip-audit on every push to main + a weekly cron, with PR runs informational
# only (the security check shouldn't block normal PRs unless the PR itself
# touches dependencies).
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/audit.yml"
  schedule:
    - cron: "17 8 * * 1"  # Mondays 08:17 UTC
  workflow_dispatch:

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra mcp --extra otel

      - name: Run pip-audit
        # Audit the installed dependencies, skipping the editable local
        # project (pip-audit can't resolve the unpublished consult-mcp-server
        # on PyPI). --strict is intentionally omitted because it would fail on
        # that skip; real vulnerabilities still fail the build without it.
        #
        # The four ignored advisories are all litellm proxy-server issues
        # (privilege escalation, RCE via the /config/update endpoint, and
        # JWT / auth bypass on proxy endpoints). consult imports litellm only
        # as a client SDK (acompletion / completion_cost) and never runs the
        # proxy, so none are reachable. Revisit if we ever pull litellm[proxy].
        # Document any further irrelevant CVE the same way, with a reason.
        run: >
          uv run pip-audit --skip-editable
          --ignore-vuln CVE-2025-0628
          --ignore-vuln CVE-2026-35029
          --ignore-vuln CVE-2026-35030
          --ignore-vuln GHSA-69x8-hrgq-fjj8
