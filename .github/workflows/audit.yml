name: audit

# pip-audit on every push to main + a weekly cron, with PR runs informational
# only (the security check shouldn't block normal PRs unless the PR itself
# touches dependencies).
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/audit.yml"
  schedule:
    - cron: "17 8 * * 1"  # Mondays 08:17 UTC
  workflow_dispatch:

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra mcp --extra otel

      - name: Run pip-audit
        # Audit the installed dependencies, skipping the editable local
        # project. Once the local dev version moves ahead of the published
        # one, pip-audit can't resolve it on PyPI and --strict would fail, so
        # we audit the deps and leave the project out. The litellm proxy CVEs
        # that were ignored here are fixed as of the 1.83 bump, so no
        # --ignore-vuln entries remain; add one (with a reason) for a future
        # irrelevant CVE.
        run: uv run pip-audit --skip-editable
