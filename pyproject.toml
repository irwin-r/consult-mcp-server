[project]
name = "consult-mcp-server"
version = "0.2.0"
description = "Multi-model panel orchestration engine with an MCP adapter. The engine (consult.*) is MCP-free and usable as a library; the MCP adapter (consult.mcp.*) is an optional extra."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Irwin Razaghi", email = "irwin@razaghi.com.au" }]
keywords = ["mcp", "model-context-protocol", "llm", "consultation", "panel", "consensus", "litellm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
# litellm: pinned to a tight minor range. LiteLLM is the security boundary
# for every outbound provider call and ships frequent breaking changes in
# its provider routing, cost lookup, and exception classes — we audit each
# minor bump manually rather than letting Dependabot/Renovate float us
# forward silently. Bump deliberately when a new minor is needed.
# pydantic v2 is required for `StrictModel` / discriminated unions.
# python-dotenv loads provider keys from .env at startup.
dependencies = [
    "litellm>=1.55.0,<1.57.0",
    "pydantic>=2.6.0,<3",
    "python-dotenv>=1.0.0,<2",
]

[project.urls]
Homepage = "https://github.com/irwinr/consult-mcp-server"
Repository = "https://github.com/irwinr/consult-mcp-server"
Issues = "https://github.com/irwinr/consult-mcp-server/issues"
Changelog = "https://github.com/irwinr/consult-mcp-server/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# MCP adapter dependencies. Install with `pip install consult-mcp-server[mcp]`
# to get the `consult-mcp` stdio server. Library consumers driving the
# engine directly (runner.fanout, refine.refine, orchestrate.consult, etc.)
# don't need this.
#
# Pinned to a tight minor range: the MCP SDK is on a fast release cadence
# and the Tool/ToolAnnotations/CreateTaskResult surfaces have moved between
# minor versions. We track upstream releases manually rather than floating.
mcp = [
    "mcp>=1.2.0,<2",
]
# OpenTelemetry tracing — emits gen_ai.* semantic-conventions spans per
# panellist call when OTEL_EXPORTER_OTLP_ENDPOINT is set. Without this
# extra, telemetry helpers are no-ops at zero overhead.
otel = [
    "opentelemetry-api>=1.20,<2",
    "opentelemetry-sdk>=1.20,<2",
    "opentelemetry-exporter-otlp>=1.20,<2",
]
dev = [
    "mcp>=1.2.0,<2",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.15,<0.16",
    "pre-commit>=3.7",
    "pip-audit>=2.7",
]

[project.scripts]
consult-mcp = "consult.mcp.__main__:cli"
consult-ledger = "consult.ledger:cli"
consult-view = "consult.viewer:cli"
consult-doctor = "consult.doctor:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `consult` is the only package; hatchling includes every non-ignored file
# under it, data files (config/*.json, schemas/*.json) included. No
# force-include is needed — adding one double-counts those paths and the
# build fails with "a second file is being added at the same path".
packages = ["consult"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
