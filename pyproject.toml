[project]
name = "consult-mcp-server"
version = "0.5.0"
description = "Multi-model panel orchestration engine with an MCP adapter. The engine (consult.*) is MCP-free and usable as a library; the MCP adapter (consult.mcp.*) is an optional extra."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Irwin Razaghi", email = "irwin@razaghi.com.au" }]
keywords = ["mcp", "model-context-protocol", "llm", "consultation", "panel", "consensus", "litellm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
# litellm: pinned to a tight range. LiteLLM is the security boundary for
# every outbound provider call and ships frequent breaking changes in its
# provider routing, cost lookup, and exception classes, so we audit each bump
# manually rather than letting Dependabot/Renovate float us forward silently.
# Bumped to the 1.8x line: the proxy-auth advisories (CVE-2025-0628,
# CVE-2026-35029, CVE-2026-35030, GHSA-69x8-hrgq-fjj8) are fixed at 1.83.
# Re-audit and run the suite on each widen; see CONTRIBUTING for the cadence.
# pydantic v2 is required for `StrictModel` / discriminated unions.
# python-dotenv loads provider keys from .env at startup.
dependencies = [
    "litellm>=1.83,<1.90",
    "pydantic>=2.6.0,<3",
    "python-dotenv>=1.0.0,<2",
]

[project.urls]
Homepage = "https://github.com/irwin-r/consult-mcp-server"
Repository = "https://github.com/irwin-r/consult-mcp-server"
Issues = "https://github.com/irwin-r/consult-mcp-server/issues"
Changelog = "https://github.com/irwin-r/consult-mcp-server/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# MCP adapter dependencies. Install with `pip install consult-mcp-server[mcp]`
# to get the `consult-mcp` stdio server. Library consumers driving the
# engine directly (runner.fanout, refine.refine, orchestrate.consult, etc.)
# don't need this.
#
# Pinned to a tight minor range: the MCP SDK is on a fast release cadence
# and the Tool/ToolAnnotations/CreateTaskResult surfaces have moved between
# minor versions. We track upstream releases manually rather than floating.
# Floor raised to 1.28.1: CVE-2026-52869/52870 (session and task scoping,
# fixed 1.27.2) and CVE-2026-59950 (WebSocket Host/Origin, fixed 1.28.1).
# The task-scoping one covers the experimental task surface server.py uses.
mcp = [
    "mcp>=1.28.1,<2",
]
# OpenTelemetry tracing — emits gen_ai.* semantic-conventions spans per
# panellist call when OTEL_EXPORTER_OTLP_ENDPOINT is set. Without this
# extra, telemetry helpers are no-ops at zero overhead.
otel = [
    "opentelemetry-api>=1.20,<2",
    "opentelemetry-sdk>=1.20,<2",
    "opentelemetry-exporter-otlp>=1.20,<2",
]
dev = [
    "mcp>=1.28.1,<2",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.15,<0.16",
    "pyright>=1.1,<2",
    "pre-commit>=3.7",
    "pip-audit>=2.7",
]

[project.scripts]
consult-mcp = "consult.mcp.__main__:cli"
consult-ledger = "consult.ledger:cli"
consult-view = "consult.viewer:cli"
consult-doctor = "consult.doctor:cli"
consult-gc = "consult.retention:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `consult` is the only package; hatchling includes every non-ignored file
# under it, data files (config/*.json, schemas/*.json) included. No
# force-include is needed — adding one double-counts those paths and the
# build fails with "a second file is being added at the same path".
packages = ["consult"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
# pydantic 2.13's Field() overloads hide positional defaults from pyright's
# dataclass_transform handling, so every Model(...) call that omits a
# defaulted field reports "argument missing" (reproducible on a 3-line
# probe). Re-enable once the pydantic/pyright pair recognises defaults.
reportCallIssue = false
pythonVersion = "3.11"
include = ["consult"]
# LiteLLM and the OTel API ship partial typing; missing-stub noise isn't a
# defect in this codebase.
reportMissingTypeStubs = false
